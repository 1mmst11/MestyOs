<body>

    <script>
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'en',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');

        // 1. Автоматически узнаем точный язык системы пользователя (ru, ja, de, fr и т.д.)
        const userLang = (navigator.language || navigator.userLanguage).toLowerCase().split('-')[0];

        // 2. Если язык пользователя НЕ английский, принудительно переводим сайт на его язык
        if (userLang !== 'en') {
            document.cookie = `googtrans=/en/${userLang}; path=/; domain=.github.io`;
            document.cookie = `googtrans=/en/${userLang}; path=/;`;
        }
    }
</script>
<script src="//://google.com"></script>

</body>
